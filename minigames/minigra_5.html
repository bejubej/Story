<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prom Megastar - Wielki Kryzys Pęcherza</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background: #0d0e12;
          color: #e2e4e9;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
          user-select: none;
      }

      .game-box {
          width: 500px;
          background: #161920;
          border: 2px solid #ff9900;
          border-radius: 16px;
          padding: 25px;
          text-align: center;
          box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      }

      h1 {
          font-size: 22px;
          color: #ff9900;
          margin-bottom: 5px;
          text-transform: uppercase;
          letter-spacing: 1px;
      }

      .subtitle {
          font-size: 11px;
          color: #8892b0;
          text-transform: uppercase;
          margin-bottom: 15px;
          letter-spacing: 2px;
      }

      .inventory-box {
          background: #1e222b;
          border: 1px dashed #3b4252;
          padding: 10px;
          border-radius: 6px;
          font-size: 12px;
          margin-bottom: 15px;
          color: #ffcc00;
          font-weight: bold;
          letter-spacing: 0.5px;
      }

      .location-box {
          background: #0f1115;
          padding: 20px;
          border-radius: 10px;
          min-height: 130px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-size: 14px;
          line-height: 1.5;
          margin-bottom: 20px;
          border: 1px solid #2d3139;
          color: #c9cdd6;
      }

      .btn-container {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }

      .nav-btn {
          background: #212631;
          color: #fff;
          border: 1px solid #3b4252;
          padding: 12px 15px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 13px;
          font-weight: bold;
          text-align: left;
          transition: all 0.2s;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }
      .nav-btn:hover {
          background: #2d3444;
          border-color: #ff9900;
          padding-left: 20px;
      }

      .penalty-tag {
          color: #ff5555;
          font-size: 11px;
          font-weight: normal;
      }

      .code-panel {
          margin-bottom: 12px;
          display: flex;
          gap: 10px;
          justify-content: center;
          width: 100%;
      }
      .code-input {
          background: #000;
          border: 1px solid #3b4252;
          color: #33ff33;
          padding: 10px;
          font-size: 16px;
          font-family: monospace;
          text-align: center;
          border-radius: 6px;
          width: 130px;
          letter-spacing: 4px;
      }
      .code-input:focus {
          outline: none;
          border-color: #ff9900;
      }
      .code-submit {
          background: #ff9900;
          color: #000;
          border: 0;
          padding: 10px 20px;
          font-weight: bold;
          border-radius: 6px;
          cursor: pointer;
      }
      .code-submit:hover {
          background: #ffaa22;
      }

      .timer-container {
          margin-top: 20px;
          background: #0f1115;
          padding: 12px;
          border-radius: 8px;
          border: 1px solid #2d3139;
      }

      .progress-bar {
          width: 100%;
          height: 8px;
          background: #222;
          border-radius: 4px;
          margin-top: 8px;
          overflow: hidden;
      }

      .progress-fill {
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, #ff3333, #ff9900, #33ff33);
          transition: width 0.1s linear;
      }

      #timeText {
          color: #ff9900;
          font-size: 20px;
          font-weight: bold;
          font-family: monospace;
      }

      .overlay {
          display: none; position: fixed; inset: 0; background: rgba(10,12,16,0.98);
          z-index: 100; justify-content: center; align-items: center; flex-direction: column;
          padding: 20px;
      }
      .overlay.active { display: flex; }
      .overlay h2 { font-size: 28px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
      .overlay p { margin-bottom: 25px; color: #a0aec0; text-align: center; max-width: 420px; line-height: 1.6; font-size: 14px; }

      .restart-btn {
          background: #ff9900; color: #000; border: 0; padding: 14px 35px;
          font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      }
      .restart-btn:hover { background: #ffaa22; }
  </style>
</head>
<body>

<div class="game-box" id="gameWindow">
  <h1>Ewakuacja Pęcherza</h1>
  <div class="subtitle">Prom MegaStar // Pokłady 7-9</div>

  <div class="inventory-box" id="inventoryDisplay">
    EKWIPUNEK: Puste ręce
  </div>

  <div class="location-box" id="locationDescription">
    Inicjalizacja pokładów promu...
  </div>

  <div class="btn-container" id="choicesContainer"></div>

  <div class="timer-container">
    <div>POZOSTAŁY CZAS KRYTYCZNY: <span id="timeText">45.0s</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <h2 id="endTitle">Status</h2>
  <p id="endDesc"></p>
  <button class="restart-btn" onclick="restartGame()">Spróbuj ponownie</button>
</div>

<script>
  const locationDescription = document.getElementById("locationDescription");
  const choicesContainer = document.getElementById("choicesContainer");
  const timeText = document.getElementById("timeText");
  const progressFill = document.getElementById("progressFill");
  const inventoryDisplay = document.getElementById("inventoryDisplay");
  const endOverlay = document.getElementById("endOverlay");
  const endTitle = document.getElementById("endTitle");
  const endDesc = document.getElementById("endDesc");

  let timeLeft = 45.0;
  let gameTimer = null;
  let isGameOver = false;

  let posiadaKod = false;
  let posiadaKlucz = false;

  const mapData = {
    poklad_8: {
      text: "Jesteś na Pokładzie 8 (Główny pasażerski). Pęcherz uciska do granic możliwości. Masz ostatnią chwilę, by zdążyć do WC. Przed Tobą pasaż handlowy, schody na inne pokłady oraz wejście do strefy gastro.",
      choices: [
        { text: "Wejdź do Restauracji Buffet", wejdźDo: "restauracja" },
        { text: "Idź w kierunku Sklepu Duty-Free", wejdźDo: "sklep" },
        { text: "Zbiegnij schodami w dół na Pokład 7 (Kajuty)", wejdźDo: "poklad_7" },
        { text: "Wjedź windą w górę na Pokład 9 (Słoneczny/Bar)", wejdźDo: "poklad_9" }
      ]
    },
    restauracja: {
      text: "Pachnie pieczonym łososiem, ale to ostatnie, o czym myślisz. Widzisz tabliczkę WC kierującą na zaplecze oraz wyjście na korytarz boczny.",
      choices: [
        { text: "Biegnij na zaplecze restauracji za znakiem WC", wejdźDo: "wc_restauracja" },
        { text: "Przejdź przez szklane drzwi do Korytarza Ewakuacyjnego", wejdźDo: "korytarz_ewak" },
        { text: "Wycofaj się na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    wc_restauracja: {
      text: "Dopadasz do drzwi toalety. Naciskasz klamkę... ZAMKNIĘTE! Na drzwiach wisi kartka: 'Awaria hydrauliki. Najbliższe WC na Pokładzie 7 lub 9'. Tracisz cenne sekundy!",
      choices: [
        { text: "Przeklinaj pod nosem i wróć do restauracji", wejdźDo: "restauracja", kara: 3 }
      ]
    },
    korytarz_ewak: {
      text: "Cichy, techniczny korytarz za kuchnią. Widzisz pojedyncze drzwi bez oznaczeń oraz schody serwisowe w dół.",
      choices: [
        { text: "Szarpnij za nieoznaczone drzwi", wejdźDo: "schowek_szczotki", kara: 4 },
        { text: "Zejdź schodami serwisowymi na Pokład 7", wejdźDo: "poklad_7_serwis" },
        { text: "Wróć do restauracji", wejdźDo: "restauracja" }
      ]
    },
    schowek_szczotki: {
      text: "Wpadasz do schowka na mopy. Agresywny zapach chloru uderza w nos. Tu nie ma ulgi. Tracisz czas na wycofanie się.",
      choices: [
        { text: "Wróć na korytarz", wejdźDo: "korytarz_ewak" }
      ]
    },
    sklep: {
      text: "Promocja przyciągnęła tłumy. Przejścia są całkowicie zakleszczone przez wózki pasażerów. Tracisz siły na przepychanie się.",
      choices: [
        { text: "Przepychaj się na drugą stronę sklepu do punktu informacyjnego", wejdźDo: "info_sklep", kara: 5 },
        { text: "Zawróć natychmiast na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    info_sklep: {
      text: "Docierasz do informacji. Kasjer odpowiada spokojnie: 'Toalety w sklepie są tylko dla personelu. Publiczne są na Pokładzie 7, ale drzwi wymagają KODU z paragonu kafeterii Pokładu 9'.",
      choices: [
        { text: "Wracaj na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    poklad_7: {
      text: "Pokład 7. Labirynt korytarzy z kajutami. Na ścianie wisi upragniony piktogram WC prowadzący do drzwi na końcu korytarza A.",
      choices: [
        { text: "Biegnij do drzwi WC w korytarzu A", wejdźDo: "wc_poklad_7" },
        { text: "Skręć w korytarz B prowadzący do Recepcji", wejdźDo: "recepcja" },
        { text: "Wróć schodami na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    poklad_7_serwis: {
      text: "Schody serwisowe rzuciły Cię na tyły korytarza na Pokładzie 7. Jesteś bardzo blisko strefy WC.",
      choices: [
        { text: "Biegnij prosto do drzwi WC", wejdźDo: "wc_poklad_7" }
      ]
    },
    wc_poklad_7: {
      text: "Dopadasz do drzwi. Na klamce zainstalowano cyfrowy zamek szyfrowy. Wprowadź 4-cyfrowy KOD dostępu, aby odblokować zamek.",
      choices: [
        { text: "Zrezygnuj i biegnij do Recepcji", wejdźDo: "recepcja" },
        { text: "Szarp za drzwi z całych sił (Próba taranu)", wejdźDo: "wc_poklad_7_szarpanie", kara: 5 },
        { text: "Wróć na Pokład 8", wejdźDo: "poklad_8" }
      ],
      showCodePanel: true
    },
    wc_poklad_7_szarpanie: {
      text: "Metalowa futryna nawet nie drgnęła. Osiągasz jedynie potworny ucisk w podbrzuszu. Tracisz 5 sekund!",
      choices: [
        { text: "Szukaj innego wyjścia", wejdźDo: "poklad_7" }
      ]
    },
    recepcja: {
      text: "Pusta lada recepcji. Recepcjonista odszedł, a na blacie leży porzucony klucz serwisowy z czerwoną zawieszką 'Klucz WC - Pokład 9'. Możesz spróbować go zabrać (50% szans na sukces).",
      choices: [
        { text: "[RYZYKO 50%] Spróbuj ukraść klucz z blatu", wejdźDo: "recepcja_proba_kradziezy" },
        { text: "Nie ryzykuj, biegnij na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    poklad_9: {
      text: "Pokład 9. Bar widokowy. Gra głośna muzyka. Widzisz ladę barową oraz zamknięte drzwi 'WC VIP - Tylko dla personelu / VIP'.",
      choices: [
        { text: "Kup coś w barze, by dostać paragon z kodem", wejdźDo: "bar_kod" },
        { text: "Podejdź do drzwi WC VIP", wejdźDo: "wc_vip" },
        { text: "Zjedź windą z powrotem na Pokład 8", wejdźDo: "poklad_8" }
      ]
    },
    bar_kod: {
      text: "Kupujesz najtańszą gumę do żucia. Barman wydaje paragon, na którym wydrukowano: 'Kod do WC Pokładu 7: 2941'. Zapamiętaj go!",
      choices: [
        { text: "Biegnij z kodem na Pokład 7!", wejdźDo: "poklad_7" }
      ]
    },
    wc_vip: {
      text: "Drzwi do toalety VIP są solidne i zamknięte na zamek patentowy: 'Wstęp tylko z kluczem'.",
      choices: [
        { text: "[Mam klucz] Użyj skradzionego klucza z recepcji", wejdźDo: "toaleta_wygrana", warunek: "klucz" },
        { text: "Krzycz i błagaj barmana o otwarcie", wejdźDo: "barman_odmowa", kara: 4 },
        { text: "Wróć na środek Pokładu 9", wejdźDo: "poklad_9" }
      ]
    },
    barman_odmowa: {
      text: "Barman ignoruje Twoje krzyki. Marnujesz 4 sekundy na bezskuteczne błagania.",
      choices: [
        { text: "Działaj dalej!", wejdźDo: "poklad_9" }
      ]
    },
    toaleta_wygrana: {
      text: "Drzwi stają otworem! Wpadasz do środka, ryglujesz zamek i doświadczasz absolutnej ulgi. Udało się zdążyć!",
      choices: []
    }
  };

  function checkManualCode() {
    const inputEl = document.getElementById("manualCodeInput");
    if (!inputEl) return;
    const inputVal = inputEl.value.trim();

    if (inputVal === "2941") {
      goToLocation("toaleta_wygrana");
    } else {
      alert("BŁĘDNY KOD! Zamek pika na czerwono. Tracisz 3 sekundy na reset.");
      timeLeft -= 3.0;
      if (timeLeft < 0) timeLeft = 0;
      timeText.textContent = timeLeft.toFixed(1) + "s";
      inputEl.value = "";
      inputEl.focus();
    }
  }

  function updateInventoryDisplay() {
    if (posiadaKlucz && posiadaKod) inventoryDisplay.textContent = "EKWIPUNEK: Klucz WC Pokładu 9 + Kod z paragonu (2941)";
    else if (posiadaKlucz) inventoryDisplay.textContent = "EKWIPUNEK: Klucz WC Pokładu 9";
    else if (posiadaKod) inventoryDisplay.textContent = "EKWIPUNEK: Kod z paragonu (2941)";
    else inventoryDisplay.textContent = "EKWIPUNEK: Puste ręce";
  }

  function goToLocation(locKey, czasKara = 0) {
    if (isGameOver) return;

    if (locKey === "recepcja_proba_kradziezy") {
      if (Math.random() < 0.5) {
        posiadaKlucz = true;
        alert("SUKCES! Klucz sprzątnięty z blatu w mgnieniu oka.");
        mapData.recepcja.text = "Lada recepcji jest pusta. Klucz został już zabrany.";
        mapData.recepcja.choices = [{ text: "Biegnij na Pokład 8", wejdźDo: "poklad_8" }];
        locKey = "poklad_8";
      } else {
        endGame(false, "zlapanay_ochrona");
        return;
      }
    }

    if (locKey === "bar_kod") posiadaKod = true;

    updateInventoryDisplay();

    if (czasKara > 0) {
      timeLeft -= czasKara;
      if (timeLeft < 0) timeLeft = 0;
      timeText.textContent = timeLeft.toFixed(1) + "s";
    }

    const currentLoc = mapData[locKey];

    if (currentLoc.warunek === "klucz" && !posiadaKlucz) {
      alert("Zamek trzyma mocno. Potrzebujesz klucza z recepcji!");
      return;
    }

    locationDescription.textContent = currentLoc.text;
    choicesContainer.innerHTML = "";

    if (currentLoc.showCodePanel) {
      const panel = document.createElement("div");
      panel.className = "code-panel";
      panel.innerHTML = `
        <input type="text" id="manualCodeInput" class="code-input" placeholder="----" maxlength="4" autocomplete="off">
        <button class="code-submit" onclick="checkManualCode()">WPISZ</button>
      `;
      choicesContainer.appendChild(panel);

      const inputEl = panel.querySelector("#manualCodeInput");
      inputEl.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkManualCode();
      });
      setTimeout(() => inputEl.focus(), 50);
    }

    if (locKey === "toaleta_wygrana") {
      endGame(true);
      return;
    }

    currentLoc.choices.forEach(choice => {
      if (choice.warunek === "klucz" && !posiadaKlucz) return;

      const btn = document.createElement("button");
      btn.className = "nav-btn";

      const penaltyLabel = choice.kara ? `<span class="penalty-tag">[-${choice.kara}s]</span>` : '';
      btn.innerHTML = `<span>${choice.text}</span> ${penaltyLabel}`;

      btn.onclick = () => goToLocation(choice.wejdźDo, choice.kara || 0);
      choicesContainer.appendChild(btn);
    });
  }

  function startTimer() {
    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame(false, "czas_minal");
      }
      timeText.textContent = timeLeft.toFixed(1) + "s";

      let percent = (timeLeft / 45.0) * 100;
      progressFill.style.width = percent + "%";
    }, 100);
  }

  function endGame(success, powodPrzegranej = "") {
    isGameOver = true;
    clearInterval(gameTimer);
    endOverlay.classList.add("active");

    if (success) {
      endTitle.textContent = "ULGA TOTALNA!";
      endTitle.style.color = "#33ff33";
      endDesc.textContent = "Udało się! Po ekspresowym sprincie przez pokłady promu, rozszyfrowaniu zamków i uniku przed tłumem, docierasz do celu w suchym ubraniu.";
      (window.opener || window.parent).postMessage({ type: "minigameComplete" }, "*");
    } else {
      endTitle.textContent = "PORAŻKA";
      endTitle.style.color = "#ff3333";

      if (powodPrzegranej === "zlapanay_ochrona") {
        endDesc.textContent = "ZŁAPANO CIĘ NA GORĄCYM UCZYNKU! Gdy tylko sięgasz po klucz, zza rogu wychodzi potężny oficer ochrony. Przesłuchanie w biurze kończy się w mocno upokarzających okolicznościach...";
      } else {
        endDesc.textContent = "Pęcherz skapitulował na schodach Pokładu 8. Fala porażki zniszczyła ubranie i resztki godności na oczach pasażerów. Czas na natychmiastowy odwrót do kajuty...";
      }
    }
  }

  function restartGame() {
    timeLeft = 45.0;
    isGameOver = false;
    posiadaKod = false;
    posiadaKlucz = false;

    mapData.recepcja.text = "Pusta lada recepcji. Recepcjonista odszedł, a na blacie leży porzucony klucz serwisowy z czerwoną zawieszką 'Klucz WC - Pokład 9'. Możesz spróbować go zabrać (50% szans na sukces).";
    mapData.recepcja.choices = [
      { text: "[RYZYKO 50%] Spróbuj ukraść klucz z blatu", wejdźDo: "recepcja_proba_kradziezy" },
      { text: "Nie ryzykuj, biegnij na Pokład 8", wejdźDo: "poklad_8" }
    ];

    endOverlay.classList.remove("active");
    startTimer();
    goToLocation("poklad_8");
  }

  window.onload = function() {
    restartGame();
  };
</script>
</body>
</html>

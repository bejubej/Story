<!-- pingpong -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Solo</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background: #020a05;
          color: #33ff33;
          font-family: 'Courier New', monospace;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
          user-select: none;
      }

      .game-box {
          width: 440px;
          background: #000200;
          border: 3px solid #114411;
          border-radius: 12px;
          padding: 20px;
          box-shadow: 0 0 35px rgba(51, 255, 51, 0.2);
      }

      .header {
          text-align: center;
          margin-bottom: 15px;
          border-bottom: 1px dashed #114411;
          padding-bottom: 12px;
      }
      .header h1 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #55ff55; }

      .instructions {
          background: rgba(17, 68, 17, 0.15);
          border: 1px solid #114411;
          border-radius: 6px;
          padding: 10px 12px;
          font-size: 11px;
          line-height: 1.5;
          color: #aaffaa;
          margin-bottom: 15px;
      }
      .instructions span { color: #ff3333; font-weight: bold; }

      .canvas-container {
          position: relative;
          margin-bottom: 15px;
      }

      #pongCanvas {
          background: #000000;
          border: 2px solid #114411;
          border-radius: 8px;
          display: block;
      }

      .stats {
          background: #031405;
          padding: 10px;
          border-radius: 6px;
          border: 1px solid #114411;
          font-size: 12px;
          text-align: center;
          font-weight: bold;
      }

      .overlay {
          display: none; position: fixed; inset: 0; background: rgba(0, 2, 0, 0.97);
          z-index: 100; justify-content: center; align-items: center; flex-direction: column;
      }
      .overlay.active { display: flex; }
      .overlay h2 { font-size: 22px; margin-bottom: 20px; text-align: center; text-transform: uppercase; color: #33ff33; }
      .btn {
          background: #33ff33; color: #000000; border: 0; padding: 12px 28px;
          font-family: inherit; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
      }
  </style>
</head>
<body>

<div class="game-box">
  <div class="header">
    <h1>WALL_BREAKER // INTRUDER PONG</h1>
  </div>

  <div class="instructions">
    Steruj paletką na dole za pomocą <span>A / D</span> lub <span>STRZAŁEK</span>. Rozbij wszystkie bloki
  </div>

  <div class="canvas-container">
    <canvas id="pongCanvas" width="400" height="300"></canvas>
  </div>

  <div class="stats" id="statusText" style="color: #ffaa00;">Progress...</div>
</div>

<div class="overlay" id="endOverlay">
  <h2 id="endTitle">ZAPORA ZNISZCZONA!</h2>
  <button class="btn" onclick="initGame()">RESTART</button>
</div>

<script>
  const canvas = document.getElementById("pongCanvas");
  const ctx = canvas.getContext("2d");
  const statusText = document.getElementById("statusText");
  const endOverlay = document.getElementById("endOverlay");
  const endTitle = document.getElementById("endTitle");

  let isGameOver = false;

  // Paletka gracza
  const paddle = {
    width: 70,
    height: 8,
    x: (canvas.width - 70) / 2,
    y: canvas.height - 20,
    speed: 7
  };

  // Piłka (próbnik)
  const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 5,
    dx: 3,
    dy: -3,
    baseSpeed: 4.5,
    maxSpeed: 8
  };

  // Konfiguracja bloków Firewalla
  const brickRows = 3;
  const brickCols = 8;
  const brickWidth = 44;
  const brickHeight = 14;
  const brickPadding = 5;
  const brickOffsetTop = 30;
  const brickOffsetLeft = 6;

  let bricks = [];

  const keys = { left: false, right: false };

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  function initGame() {
    isGameOver = false;
    endOverlay.classList.remove("active");
    statusText.textContent = "Progress...";
    statusText.style.color = "#ffaa00";

    paddle.x = (canvas.width - paddle.width) / 2;

    ball.x = canvas.width / 2;
    ball.y = canvas.height - 50;

    // Kąt początkowy
    ball.dx = (Math.random() > 0.5 ? 1 : -1) * 2.5;
    ball.dy = -3.5;

    // Generowanie pozycji klocków na stałe podczas inicjalizacji
    bricks = [];
    for (let r = 0; r < brickRows; r++) {
      bricks[r] = [];
      for (let c = 0; c < brickCols; c++) {
        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
        bricks[r][c] = { x: brickX, y: brickY, active: 1 };
      }
    }

    if (!window.pongAnimation) {
      window.pongAnimation = true;
      requestAnimationFrame(gameLoop);
    }
  }

  function checkWinCondition() {
    for (let r = 0; r < brickRows; r++) {
      for (let c = 0; c < brickCols; c++) {
        if (bricks[r][c].active === 1) {
          return false; // Znalazł chociaż jeden aktywny klocek -> gramy dalej
        }
      }
    }
    return true; // Brak aktywnych klocków -> wygrana
  }

  function updatePhysics() {
    // Ruch paletki
    if (keys.left && paddle.x > 0) paddle.x -= paddle.speed;
    if (keys.right && paddle.x < canvas.width - paddle.width) paddle.x += paddle.speed;

    // Ruch piłki
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Odbicia od ścian bocznych
    if (ball.x - ball.radius <= 0) {
      ball.x = ball.radius;
      ball.dx = -ball.dx;
    }
    if (ball.x + ball.radius >= canvas.width) {
      ball.x = canvas.width - ball.radius;
      ball.dx = -ball.dx;
    }

    // Odbicie od sufitu (teraz nie wygrywa automatycznie!)
    if (ball.y - ball.radius <= 0) {
      ball.y = ball.radius;
      ball.dy = -ball.dy;
    }

    // Odbicie od paletki
    if (ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height) {
      if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
        // Wyznaczenie punktu uderzenia dla dynamicznego odbicia
        let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);

        // Obliczenie aktualnej ogólnej prędkości wektora
        let currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
        if (currentSpeed < ball.baseSpeed) currentSpeed = ball.baseSpeed;

        ball.dx = hitPoint * (currentSpeed * 0.9);
        ball.dy = -Math.sqrt(Math.abs(currentSpeed * currentSpeed - ball.dx * ball.dx));

        // Korekta pozycji, aby zapobiec utknięciu w paletce
        ball.y = paddle.y - ball.radius;
      }
    }

    // Detekcja kolizji z blokami firewalla
    for (let r = 0; r < brickRows; r++) {
      for (let c = 0; c < brickCols; c++) {
        let b = bricks[r][c];
        if (b.active === 1) {

          // Zaawansowane sprawdzanie punktu najbliższego klocka względem środka piłki
          let closestX = Math.max(b.x, Math.min(ball.x, b.x + brickWidth));
          let closestY = Math.max(b.y, Math.min(ball.y, b.y + brickHeight));

          let distanceX = ball.x - closestX;
          let distanceY = ball.y - closestY;
          let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

          if (distanceSquared < ball.radius * ball.radius) {
            b.active = 0; // Blok zniszczony

            // Określenie kierunku odbicia na podstawie wektora penetracji
            let overlapX = ball.radius - Math.abs(distanceX);
            let overlapY = ball.radius - Math.abs(distanceY);

            if (closestX === b.x || closestX === b.x + brickWidth) {
              if (closestY === b.y || closestY === b.y + brickHeight) {
                // Uderzenie w narożnik
                if (overlapX < overlapY) {
                  ball.dx = -ball.dx;
                  ball.x += distanceX > 0 ? overlapX : -overlapX;
                } else {
                  ball.dy = -ball.dy;
                  ball.y += distanceY > 0 ? overlapY : -overlapY;
                }
              } else {
                // Uderzenie w bok klocka
                ball.dx = -ball.dx;
                ball.x += distanceX > 0 ? overlapX : -overlapX;
              }
            } else {
              // Uderzenie w górę lub dół klocka
              ball.dy = -ball.dy;
              ball.y += distanceY > 0 ? overlapY : -overlapY;
            }

            // Podkręcenie prędkości przy rozbiciu z limitem maxSpeed
            let speedMultiplier = 1.04;
            if (Math.abs(ball.dx) * speedMultiplier < ball.maxSpeed) ball.dx *= speedMultiplier;
            if (Math.abs(ball.dy) * speedMultiplier < ball.maxSpeed) ball.dy *= speedMultiplier;

            // Sprawdzenie warunku wygranej po zniszczeniu klocka
            if (checkWinCondition()) {
              endGame(true);
              return;
            }
          }
        }
      }
    }

    // WARUNEK PRZEGRANEJ: Piłka spada na dno
    if (ball.y - ball.radius > canvas.height) {
      endGame(false);
    }
  }

  function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Rysowanie bloków zapory (czerwone pakiety ochronne)
    for (let r = 0; r < brickRows; r++) {
      for (let c = 0; c < brickCols; c++) {
        if (bricks[r][c].active === 1) {
          let b = bricks[r][c];

          ctx.fillStyle = "#ff3333";
          ctx.fillRect(b.x, b.y, brickWidth, brickHeight);

          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x, b.y, brickWidth, brickHeight);

          // Hakerski sznyt - małe napisy wewnątrz bloków
          ctx.fillStyle = "#000000";
          ctx.font = "8px monospace";
          ctx.fillText("DB", b.x + brickWidth/2 - 5, b.y + brickHeight/2 + 3);
        }
      }
    }

    // Rysowanie paletki gracza
    ctx.fillStyle = "#33ff33";
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(paddle.x + 2, paddle.y + 1, paddle.width - 4, 2);

    // Rysowanie próbnika (piłki) z delikatną poświatą
    ctx.fillStyle = "#ffff33";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameLoop() {
    if (isGameOver) {
      window.pongAnimation = false;
      return;
    }

    updatePhysics();
    drawScene();

    requestAnimationFrame(gameLoop);
  }

  function endGame(success) {
    isGameOver = true;
    endOverlay.classList.add("active");
    if (success) {
      endTitle.textContent = "Wszystkie bloczki rozbite";
      endTitle.style.color = "#33ff33";
      statusText.textContent = "Klik";
      statusText.style.color = "#33ff33";
      (window.opener || window.parent).postMessage({ type: "minigameComplete" }, "*");

    } else {
      endTitle.textContent = "Skucha";
      endTitle.style.color = "#ff3333";
      statusText.textContent = "Spróbuj jeszcze raz";
      statusText.style.color = "#ff3333";
    }
  }

  initGame();
</script>
</body>
</html>

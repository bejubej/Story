<!-- photo -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuweta Chemiczna RE-7</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0f0505; color: #d15c5c; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
      .darkroom-container { width: min(900px, 100%); background: #1a0a0a; border: 4px solid #3d1616; border-radius: 16px; padding: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
      .darkroom-header { text-align: left; margin-bottom: 20px; border-bottom: 2px dashed #4a1a1a; padding-bottom: 16px; }
      .darkroom-header h1 { font-size: 24px; color: #ff9999; text-transform: uppercase; }
      .dashboard { display: grid; grid-template-columns: 1fr 220px; gap: 20px; margin-bottom: 24px; }
      .tray-wrapper { background: #260f0f; border: 4px solid #0f0505; border-radius: 8px; padding: 12px; display: flex; justify-content: center; align-items: center; }
      #photoCanvas { display: block; width: 100%; height: auto; border: 1px solid #4a1a1a; background: #120505; }
      .status-panel { background: #120505; border: 2px solid #331212; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
      .metric-box { margin-bottom: 16px; }
      .metric-label { font-size: 11px; color: #8c3b3b; text-transform: uppercase; margin-bottom: 4px; }
      .metric-value { font-size: 24px; font-weight: bold; color: #ff9999; }
      #reactionVal.stable { color: #33ff33; }
      .status-light { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ff3333; margin-right: 6px; vertical-align: middle; }
      #statusText { font-weight: bold; text-transform: uppercase; font-size: 12px; color: #ff3333; }
      .progress-container { width: 100%; background: #080202; border: 1px solid #331212; height: 14px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
      .progress-fill { height: 100%; width: 0%; background: #ff3333; transition: width 0.1s linear; }
      .progress-fill.stable { background: #33ff33; }
      .controls-panel { background: #140707; border: 2px solid #2e1010; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .control-group { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; border: 1px solid #230c0c; }
      .control-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #ff9999; }
      .slider { -webkit-appearance: none; width: 100%; height: 6px; background: #080202; border-radius: 3px; outline: none; }
      .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #260f0f; border: 2px solid #ff5555; cursor: pointer; }
      .success-overlay { display: none; position: fixed; inset: 0; background: rgba(10, 3, 3, 0.96); z-index: 100; justify-content: center; align-items: center; }
      .success-overlay.active { display: flex; }
      .success-box { background: #1a0a0a; border: 2px solid #33ff33; border-radius: 12px; padding: 40px; text-align: center; max-width: 500px; }
      .btn { background: #33ff33; color: #0f0505; border: 0; padding: 14px 32px; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<div class="darkroom-container">
  <div class="darkroom-header">
    <h1>Kuweta Chemiczna RE-7</h1>
  </div>

  <div class="dashboard">
    <div class="tray-wrapper">
      <canvas id="photoCanvas" width="500" height="375"></canvas>
    </div>

    <div class="status-panel">
      <div>
        <div class="metric-box">
          <div class="metric-label">STAN ODCZYNU</div>
          <div>
            <span class="status-light" id="statusLight"></span>
            <span id="statusText">PROCES...</span>
          </div>
        </div>
        <div class="metric-box">
          <div class="metric-label">CZYSTOŚĆ PORTRETU</div>
          <div class="metric-value"><span id="reactionVal">0.0%</span></div>
        </div>
      </div>
      <div class="metric-box" style="margin-bottom: 0;">
        <div class="metric-label">UTRWALANIE (LOCK)</div>
        <div class="progress-container">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="control-group"><div class="control-label"><span>HYDROCHINON</span><span id="hydroLabel">30%</span></div><input type="range" min="10" max="200" value="30" class="slider" id="sliderHydro"></div>
    <div class="control-group"><div class="control-label"><span>METOL</span><span id="metolLabel">170%</span></div><input type="range" min="10" max="200" value="170" class="slider" id="sliderMetol"></div>
    <div class="control-group"><div class="control-label"><span>BROMEK POTASU</span><span id="bromLabel">20%</span></div><input type="range" min="10" max="200" value="20" class="slider" id="sliderBrom"></div>
    <div class="control-group"><div class="control-label"><span>SIARCZAN SODU</span><span id="sodaLabel">150%</span></div><input type="range" min="10" max="200" value="150" class="slider" id="sliderSoda"></div>
    <div class="control-group"><div class="control-label"><span>WĘGLAN POTASU</span><span id="carbLabel">40%</span></div><input type="range" min="10" max="200" value="40" class="slider" id="sliderCarb"></div>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <h2>Wspomnienia odżywają!</h2>
    <br>
    <button class="btn" onclick="finishMinigame()">Przejdź dalej →</button>
  </div>
</div>

<script>
  // ==========================================
  // TUTAJ WPISZ ŚCIEŻKĘ DO SWOJEGO PLIKU (np. "szpieg.png" lub "img/szpieg.png")
  const IMAGE_PATH = "../1.jpg";
  // ==========================================

  console.log("-> Skrypt uruchomiony. Próba ładowania obrazu...");

  const canvas = document.getElementById("photoCanvas");
  const ctx = canvas.getContext("2d");

  const sliders = {
    hydro: document.getElementById("sliderHydro"),
    metol: document.getElementById("sliderMetol"),
    brom: document.getElementById("sliderBrom"),
    soda: document.getElementById("sliderSoda"),
    carb: document.getElementById("sliderCarb")
  };

  const labels = {
    hydro: document.getElementById("hydroLabel"),
    metol: document.getElementById("metolLabel"),
    brom: document.getElementById("bromLabel"),
    soda: document.getElementById("sodaLabel"),
    carb: document.getElementById("carbLabel")
  };

  const reactionVal = document.getElementById("reactionVal");
  const statusLight = document.getElementById("statusLight");
  const statusText = document.getElementById("statusText");
  const progressBar = document.getElementById("progressBar");
  const successOverlay = document.getElementById("successOverlay");

  let targets = { hydro: 100, metol: 100, brom: 100, soda: 100, carb: 100 };
  let matchPercent = 0, lockProgress = 0, isSecured = false;
  let userImage = new Image();
  let imgLoadedSuccessfully = false;

  function randomizeRecipe() {
    Object.keys(targets).forEach(key => {
      targets[key] = Math.floor(Math.random() * (160 - 50 + 1)) + 50;
    });
    console.log("-> Wylosowano przepis celu:", targets);
  }

  function updateDisplays() {
    Object.keys(sliders).forEach(key => {
      if(labels[key]) labels[key].textContent = sliders[key].value + "%";
    });
  }

  // Bezpieczne ładowanie
  userImage.onload = function() {
    imgLoadedSuccessfully = true;
    console.log("✓ ZDJĘCIE ZAŁADOWANE: ", userImage.src);
    randomizeRecipe();
    updateDisplays();
    loop();
  };

  userImage.onerror = function() {
    imgLoadedSuccessfully = false;
    console.error("❌ BŁĄD KRYTYČNY: Nie znaleziono pliku pod adresem: ", userImage.src);
    // Odpalamy pętlę i tak, żeby narysować komunikat błędu na ekranie
    randomizeRecipe();
    updateDisplays();
    loop();
  };

  // Dodajemy cache-busting, żeby wymusić przeładowanie
  userImage.src = IMAGE_PATH + "?v=" + Math.random();

  function drawScene(baseOpacity, blur, grain, tint, contrastErr, lightErr) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.fillStyle = "#170a0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (imgLoadedSuccessfully) {
      const safeContrast = Math.max(40, 100 - contrastErr);
      const safeBrightness = Math.max(35, 100 - lightErr);
      const safeBlur = Math.min(15, blur);

      ctx.filter = `blur(${safeBlur}px) contrast(${safeContrast}%) brightness(${safeBrightness}%) grayscale(100%)`;
      ctx.globalAlpha = Math.max(0.2, baseOpacity);
      ctx.drawImage(userImage, 15, 15, canvas.width - 30, canvas.height - 30);
    } else {
      ctx.fillStyle = "#ff5555";
      ctx.font = "12px 'Courier New'";
      ctx.textAlign = "center";
      ctx.fillText("[ BŁĄD ŁADOWANIA PLIKU ]", canvas.width / 2, canvas.height / 2);
      ctx.fillText("Ścieżka: " + IMAGE_PATH, canvas.width / 2, canvas.height / 2 + 20);
    }

    ctx.restore();
    ctx.filter = "none";

    if (tint > 0.05) {
      ctx.fillStyle = `rgba(130, 50, 15, ${tint * 0.6})`;
      ctx.fillRect(15, 15, canvas.width - 30, canvas.height - 30);
    }

    if (grain > 1 && imgLoadedSuccessfully) {
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let i = 0; i < grain * 8; i++) {
        let gx = Math.random() * canvas.width;
        let gy = Math.random() * canvas.height;
        ctx.fillRect(gx, gy, 2, 2);
      }
    }

    ctx.strokeStyle = "#ff4444";
    ctx.lineWidth = 3;
    ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
  }

  function processCryingRoom() {
    const v = {
      hydro: parseInt(sliders.hydro.value),
      metol: parseInt(sliders.metol.value),
      brom: parseInt(sliders.brom.value),
      soda: parseInt(sliders.soda.value),
      carb: parseInt(sliders.carb.value)
    };

    const errHydro = Math.abs(v.hydro - targets.hydro);
    const errMetol = Math.abs(v.metol - targets.metol);
    const errBrom = Math.abs(v.brom - targets.brom);
    const errSoda = Math.abs(v.soda - targets.soda);
    const errCarb = Math.abs(v.carb - targets.carb);

    const totalErr = (errHydro + errMetol + errBrom + errSoda + errCarb) / 5;

    const opacity = Math.max(0.1, 1 - (totalErr / 75));
    const blur = Math.max(0, errSoda / 7);
    const grain = Math.max(0, errCarb * 1.5);
    const chemicalTint = Math.min(0.95, errBrom / 80);

    drawScene(opacity, blur, grain, chemicalTint, errHydro, errMetol);

    if (!imgLoadedSuccessfully) return;

    const maxPossibleDist = 750;
    const currentDist = errHydro + errMetol + errBrom + errSoda + errCarb;
    let score = 100 - (currentDist / maxPossibleDist) * 100;

    if (score > 85) score = score + (100 - score) * 0.45;

    matchPercent = Math.min(100, Math.max(0, score));
    reactionVal.textContent = `${matchPercent.toFixed(1)}%`;

    if (matchPercent >= 98.0) {
      reactionVal.className = "stable";
      statusLight.style.background = "#33ff33";
      statusText.textContent = "UTRWALANIE...";
      statusText.style.color = "#33ff33";
      progressBar.classList.add("stable");
      lockProgress += 0.55;
      if (lockProgress >= 100) {
        lockProgress = 100;
        isSecured = true;
        setTimeout(() => { successOverlay.classList.add("active"); }, 400);
      }
    } else {
      reactionVal.className = "";
      statusLight.style.background = "#ff3333";
      statusText.textContent = "REAKCJA...";
      statusText.style.color = "#ff3333";
      progressBar.classList.remove("stable");
      lockProgress -= 1.2;
      if (lockProgress < 0) lockProgress = 0;
    }
    progressBar.style.width = `${lockProgress}%`;
  }

  function finishMinigame() {
    localStorage.setItem("minigame3Solved", "true");
    successOverlay.classList.remove("active");
    document.body.innerHTML = `<div style="color:#33ff33; font-size: 20px; text-align:center; width:100%;">✓ ZALICZONE</div>`;
    (window.opener || window.parent).postMessage({ type: "minigameComplete" }, "*");
  }

  function loop() {
    if (!isSecured) {
      processCryingRoom();
      requestAnimationFrame(loop);
    }
  }

  Object.values(sliders).forEach(slider => {
    slider.addEventListener("input", updateDisplays);
  });
</script>

</body>
</html>

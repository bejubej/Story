<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAPO - Skaner Kierunkowy</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background: #04090e;
          color: #52a2ff;
          font-family: 'Courier New', monospace;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
          user-select: none;
      }

      .game-box {
          width: 460px;
          background: #02070d;
          border: 2px solid #1a3a5f;
          border-radius: 12px;
          padding: 20px;
          box-shadow: 0 0 35px rgba(26, 58, 95, 0.4);
      }

      .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 15px;
          border-bottom: 1px dashed #1a3a5f;
          padding-bottom: 12px;
      }
      .header h1 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #6bb2ff; }
      .stage-badge { font-size: 11px; color: #ffb84d; border: 1px solid #ffb84d; padding: 2px 6px; border-radius: 4px; }

      .instructions {
          background: rgba(26, 58, 95, 0.15);
          border: 1px solid #1a3a5f;
          border-radius: 6px;
          padding: 10px 12px;
          font-size: 11px;
          line-height: 1.5;
          color: #9cd0ff;
          margin-bottom: 15px;
      }
      .instructions strong { color: #ffb84d; }

      .canvas-container {
          position: relative;
          margin-bottom: 15px;
          cursor: none;
      }

      #radarCanvas {
          background: #010307;
          border: 2px solid #142d4c;
          border-radius: 8px;
          display: block;
      }

      .dashboard {
          background: #04111f;
          border: 1px solid #1a3a5f;
          border-radius: 6px;
          padding: 12px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
          font-size: 11px;
          margin-bottom: 10px;
      }
      .dash-item { display: flex; flex-direction: column; }
      .dash-label { color: #467cb4; text-transform: uppercase; margin-bottom: 2px; font-size: 9px; }
      .dash-val { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .progress-bar-container {
          width: 100%;
          background: #02070d;
          border: 1px solid #1a3a5f;
          height: 18px;
          border-radius: 4px;
          overflow: hidden;
          position: relative;
      }
      .progress-bar-fill {
          height: 100%;
          width: 0%;
          background: #1a75ff;
          transition: width 0.05s linear;
      }
      .progress-text {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 10px;
          font-weight: bold;
          color: #ffffff;
          text-shadow: 0 0 4px #000;
      }

      .overlay {
          display: none; position: fixed; inset: 0; background: rgba(2, 7, 13, 0.96);
          z-index: 100; justify-content: center; align-items: center; flex-direction: column;
          padding: 20px;
      }
      .overlay.active { display: flex; }
      .overlay h2 { font-size: 22px; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
      .btn {
          background: #1a75ff; color: #ffffff; border: 0; padding: 12px 28px;
          font-family: inherit; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
          box-shadow: 0 0 15px rgba(26, 117, 255, 0.4); margin-top: 15px;
      }
      .btn:hover { background: #3385ff; }
  </style>
</head>
<body>

<div class="game-box">
  <div class="header">
    <h1>KAPO // SIGINT SCANNER</h1>
    <div class="stage-badge" id="stageBadge">POZIOM 1/2</div>
  </div>

  <div class="instructions">
    <strong>OPERACJA PÕHJATÄHT:</strong> Steruj celownikiem nad pasażerami. Namierz osobę z anomalnym transferem i utrzymaj na niej zasięg skanera. Unikaj przerw w trakcie zakłóceń!
  </div>

  <div class="canvas-container">
    <canvas id="radarCanvas" width="420" height="280"></canvas>
  </div>

  <div class="dashboard">
    <div class="dash-item">
      <div class="dash-label">Analiza pakietów</div>
      <div class="dash-val" id="packetType" style="color: #7ab3ef;">BEZCZYNNOŚĆ...</div>
    </div>
    <div class="dash-item" style="text-align: right;">
      <div class="dash-label">Poziom zakłóceń</div>
      <div class="dash-val" id="jammingStatus" style="color: #33ff33;">0% (STABILNY)</div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="syncFill"></div>
    <div class="progress-text">SYNCHRONIZACJA DANYCH: <span id="syncText">0%</span></div>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <h2 id="endTitle">ZALICZONE!</h2>
  <div id="endSubtitle" style="color:#7ab3ef; font-size:13px; text-align:center;"></div>
  <button class="btn" id="overlayBtn" onclick="restartGame()">Kolejna operacja</button>
</div>

<script>
  const canvas = document.getElementById("radarCanvas");
  const ctx = canvas.getContext("2d");
  const packetType = document.getElementById("packetType");
  const jammingStatus = document.getElementById("jammingStatus");
  const syncFill = document.getElementById("syncFill");
  const syncText = document.getElementById("syncText");
  const endOverlay = document.getElementById("endOverlay");
  const endTitle = document.getElementById("endTitle");
  const endSubtitle = document.getElementById("endSubtitle");
  const overlayBtn = document.getElementById("overlayBtn");
  const stageBadge = document.getElementById("stageBadge");

  let currentStage = 1;
  let isGameOver = false;

  let mouse = { x: 210, y: 140 };
  let scanRadius = 35;

  let targets = [];
  let targetCount = 10;
  let targetIndexSpy = 0;

  let syncProgress = 0;

  let jamTimer = 0;
  let isJammingActive = false;
  let jamDuration = 0;

  const fakeSignals = [
    "Standardowe WiFi - YouTube",
    "Ruch LTE - Social Media",
    "Komunikator szyfrowany",
    "Pobieranie: mobilna transmisja",
    "Strumieniowanie muzyki",
    "Przeglądarka internetowa"
  ];

  function initGame() {
    isGameOver = false;
    syncProgress = 0;
    jamTimer = 0;
    isJammingActive = false;
    endOverlay.classList.remove("active");

    setupStage();
    generateTargets();
    requestAnimationFrame(gameLoop);
  }

  function advanceStage() {
    syncProgress = 0;
    jamTimer = 0;
    isJammingActive = false;
    setupStage();
    generateTargets();
  }

  function setupStage() {
    stageBadge.textContent = `POZIOM ${currentStage}/2`;
    if (currentStage === 1) {
      targetCount = 10;
      scanRadius = 38;
    } else {
      targetCount = 18;
      scanRadius = 30; // Mniejszy celownik na trudniejszym poziomie
    }
  }

  function generateTargets() {
    targets = [];
    for (let i = 0; i < targetCount; i++) {
      targets.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: Math.random() * (canvas.height - 60) + 30,
        vx: (Math.random() - 0.5) * (currentStage === 1 ? 1.8 : 2.8),
        vy: (Math.random() - 0.5) * (currentStage === 1 ? 1.8 : 2.8),
        signalType: fakeSignals[Math.floor(Math.random() * fakeSignals.length)]
      });
    }

    targetIndexSpy = Math.floor(Math.random() * targetCount);
    targets[targetIndexSpy].signalType = "PÕHJATÄHT // WYKRYTO UKRYTY TRANSFER";
  }

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  function updatePositions() {
    targets.forEach(t => {
      t.x += t.vx;
      t.y += t.vy;

      if (t.x < 15 || t.x > canvas.width - 15) t.vx *= -1;
      if (t.y < 15 || t.y > canvas.height - 15) t.vy *= -1;
    });
  }

  function handleJamming() {
    jamTimer++;

    if (!isJammingActive && jamTimer > (currentStage === 1 ? 220 : 150)) {
      if (Math.random() < 0.35) {
        isJammingActive = true;
        jamDuration = currentStage === 1 ? 70 : 110;
        jamTimer = 0;
      }
    }

    if (isJammingActive) {
      jamDuration--;
      jammingStatus.textContent = "95% (ZAKŁÓCENIA STRUKTURALNE)";
      jammingStatus.style.color = "#ff3333";
      if (jamDuration <= 0) {
        isJammingActive = false;
        jamTimer = 0;
      }
    } else {
      jammingStatus.textContent = "0% (STABILNY)";
      jammingStatus.style.color = "#33ff33";
    }
  }

  function checkScanning() {
    let itemDetected = "BRAK SYGNAŁU";
    let detectedTargets = [];

    targets.forEach((t, index) => {
      const dist = Math.hypot(mouse.x - t.x, mouse.y - t.y);
      if (dist <= scanRadius) {
        detectedTargets.push(index);
      }
    });

    if (isJammingActive) {
      packetType.textContent = "[Zakłócenia!!!]";
      packetType.style.color = "#ff3333";
      // Spadek paska podczas zakłóceń
      syncProgress = Math.max(0, syncProgress - 0.1);
      updateSyncUI();
      return;
    }

    if (detectedTargets.length > 0) {
      // Jeśli w zasięgu jest kilku pasażerów, preferuj pokazanie szpiega, jeśli tam jest
      const hasSpy = detectedTargets.includes(targetIndexSpy);
      const chosenIndex = hasSpy ? targetIndexSpy : detectedTargets[0];

      itemDetected = targets[chosenIndex].signalType;

      if (hasSpy) {
        packetType.style.color = "#ff9900";
        // Wyższa prędkość synchronizacji, aby gra była bardziej responsywna
        syncProgress += 0.5;
        if (syncProgress >= 100) {
          syncProgress = 100;
          if (currentStage === 2) {
            endGame(true);
          } else {
            currentStage++;
            advanceStage();
          }
        }
      } else {
        packetType.style.color = "#ffffff";
        syncProgress = Math.max(0, syncProgress - 0.15);
      }
    } else {
      packetType.style.color = "#7ab3ef";
      syncProgress = Math.max(0, syncProgress - 0.15);
    }

    packetType.textContent = itemDetected;
    updateSyncUI();
  }

  function updateSyncUI() {
    syncFill.style.width = `${syncProgress}%`;
    syncText.textContent = `${Math.floor(syncProgress)}%`;
  }

  function drawRadar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Siatka techniczna radaru
    ctx.strokeStyle = "#081b30";
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 35) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 35) {
      ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    // 2. Kropki pasażerów z lekką poświatą
    targets.forEach((t, index) => {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);

      if (isJammingActive) {
        if (Math.random() > 0.4) return;
        ctx.fillStyle = `rgba(255, 82, 82, ${Math.random() * 0.5})`;
      } else {
        ctx.fillStyle = "#52a2ff";
      }
      ctx.fill();

      // Mały pierścień wokół kropek
      ctx.beginPath();
      ctx.arc(t.x, t.y, 7, 0, Math.PI * 2);
      ctx.strokeStyle = isJammingActive ? "rgba(255, 82, 82, 0.2)" : "rgba(82, 162, 255, 0.2)";
      ctx.stroke();
    });

    // 3. Dynamiczny celownik gracza
    ctx.save();
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, scanRadius, 0, Math.PI * 2);

    // Zmiana koloru celownika podczas namierzania celu
    const isOverSpy = targets[targetIndexSpy] && Math.hypot(mouse.x - targets[targetIndexSpy].x, mouse.y - targets[targetIndexSpy].y) <= scanRadius;

    if (isJammingActive) {
      ctx.strokeStyle = "rgba(255, 51, 51, 0.6)";
      ctx.fillStyle = "rgba(255, 51, 51, 0.05)";
    } else if (isOverSpy) {
      ctx.strokeStyle = "rgba(255, 153, 0, 0.9)";
      ctx.fillStyle = "rgba(255, 153, 0, 0.1)";
    } else {
      ctx.strokeStyle = "rgba(82, 162, 255, 0.7)";
      ctx.fillStyle = "rgba(82, 162, 255, 0.03)";
    }

    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();

    // Krzyż celownika
    ctx.beginPath();
    ctx.moveTo(mouse.x - 8, mouse.y); ctx.lineTo(mouse.x + 8, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 8); ctx.lineTo(mouse.x, mouse.y + 8);
    ctx.strokeStyle = isJammingActive ? "#ff3333" : (isOverSpy ? "#ff9900" : "#52a2ff");
    ctx.stroke();
    ctx.restore();
  }

  function gameLoop() {
    if (isGameOver) return;

    updatePositions()
    handleJamming();
    checkScanning();
    drawRadar();

    requestAnimationFrame(gameLoop);
  }

  function endGame(success) {
    isGameOver = true;
    endOverlay.classList.add("active");
    if (success) {
      endTitle.textContent = "POZYCJA ZLOKALIZOWANA";
      endTitle.style.color = "#33ff33";
      endSubtitle.textContent = "Proces przechwytywania danych ukończony pomyślnie. Sygnał odblokowany.";
      overlayBtn.style.display = "none";

      (window.opener || window.parent).postMessage({ type: "minigameComplete" }, "*");
    }
  }

  function restartGame() {
    currentStage = 1;
    overlayBtn.style.display = "inline-block";
    endSubtitle.textContent = "";
    initGame();
  }

  initGame();
</script>
</body>
</html>

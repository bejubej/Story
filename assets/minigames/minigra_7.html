<!-- wilk owca -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PÕHJATÄHT - Kordon Podwójny (2 Ruchy AI)</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          background: #0f141c; color: #f0f6fc;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
          user-select: none;
      }
      .game-box {
          width: 460px; background: #161b22; border: 1px solid #30363d; border-radius: 12px;
          padding: 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      h1 { font-size: 18px; color: #ff9900; text-transform: uppercase; margin-bottom: 5px; }
      .desc { font-size: 12px; color: #8b949e; margin-bottom: 15px; line-height: 1.4; }

      .grid {
          display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
          background: #21262d; padding: 4px; border-radius: 6px; margin-bottom: 15px;
      }
      .cell {
          aspect-ratio: 1; display: flex; justify-content: center; align-items: center;
          position: relative;
      }
      .cell.light { background: #f0d9b5; cursor: not-allowed; }
      .cell.dark { background: #b58863; cursor: pointer; }

      .cell.valid-move::after {
          content: ''; position: absolute; width: 25%; height: 25%;
          background: rgba(35, 134, 54, 0.8); border-radius: 50%;
      }
      .cell.valid-move:hover {
          background: #9fa474 !important;
      }

      .pawn {
          width: 80%; height: 80%; border-radius: 50%;
          display: flex; justify-content: center; align-items: center;
          font-weight: bold; font-size: 12px; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
          z-index: 2; pointer-events: none;
      }
      .pawn.player { background: #238636; border: 3px double #fff; }
      .pawn.agent { background: #da3637; border: 3px double #000; }

      .meta-line {
          font-size: 11px; color: #ff9900; font-weight: bold; text-transform: uppercase;
          margin-bottom: 5px; letter-spacing: 1px;
      }

      .overlay {
          display: none; position: fixed; inset: 0; background: rgba(13,17,23,0.98);
          z-index: 100; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
      }
      .overlay.active { display: flex; }
      .overlay h2 { font-size: 28px; margin-bottom: 15px; text-transform: uppercase; }
      .overlay p { margin-bottom: 25px; color: #8b949e; text-align: center; max-width: 360px; line-height: 1.5; }
      .btn {
          background: #ff9900; color: #000; border: 0; padding: 12px 30px;
          font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
      }
  </style>
</head>
<body>

<div class="game-box">
  <h1>Ucieknij Agentom</h1>
  <div class="desc">Zasady: <b>Wilk i Owce</b>. Uwaga: W każdej turze porusza się <b>dwóch różnych agentów</b>. Formacja napiera podwójnie szybko!</div>

  <div class="meta-line">▲ LINIA META (RZĄD 0) ▲</div>
  <div class="grid" id="gridContainer"></div>
</div>

<div class="overlay" id="endOverlay">
  <h2 id="endTitle">Status</h2>
  <p id="endDesc"></p>
  <button class="btn" onclick="resetGame()">Zagraj znowu</button>
</div>

<script>
  const gridContainer = document.getElementById("gridContainer");
  const endOverlay = document.getElementById("endOverlay");
  const endTitle = document.getElementById("endTitle");
  const endDesc = document.getElementById("endDesc");

  const size = 8;
  let player;
  let agents = [];
  let isGameOver = false;

  function drawGrid() {
    gridContainer.innerHTML = "";
    let validMoves = getValidPlayerMoves();

    if (validMoves.length === 0 && !isGameOver && player.y !== 0) {
      endGame(false, "Podwójne tempo agentów zmiażdżyło przestrzeń. Zostałeś całkowicie zablokowany bez prawa do ruchu.");
      return;
    }

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const cell = document.createElement("div");
        const isDark = (y + x) % 2 === 1;
        cell.className = `cell ${isDark ? 'dark' : 'light'}`;

        if (!isGameOver && isDark) {
          const canMove = validMoves.some(m => m.x === x && m.y === y);
          if (canMove) {
            cell.classList.add("valid-move");
            cell.onclick = () => onCellClick(x, y);
          }
        }

        if (x === player.x && y === player.y) {
          const p = document.createElement("div");
          p.className = "pawn player";
          p.textContent = "P";
          cell.appendChild(p);
        } else {
          const agentHere = agents.find(a => a.x === x && a.y === y);
          if (agentHere) {
            const a = document.createElement("div");
            a.className = "pawn agent";
            a.textContent = agentHere.id;
            cell.appendChild(a);
          }
        }

        gridContainer.appendChild(cell);
      }
    }
  }

  function getValidPlayerMoves() {
    let moves = [];
    const directions = [
      {dx: -1, dy: -1}, {dx: 1, dy: -1},
      {dx: -1, dy: 1},  {dx: 1, dy: 1}
    ];

    directions.forEach(d => {
      let nx = player.x + d.dx;
      let ny = player.y + d.dy;
      if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
        const hasAgent = agents.some(a => a.x === nx && a.y === ny);
        if (!hasAgent) {
          moves.push({x: nx, y: ny});
        }
      }
    });
    return moves;
  }

  function onCellClick(targetX, targetY) {
    if (isGameOver) return;

    player.x = targetX;
    player.y = targetY;

    if (player.y === 0) {
      endGame(true, "Czapki z głów! Ominąć barierę poruszającą się w tym tempie to czysty popis genialnego planowania.");
      return;
    }

    // Tura komputera: Wykonaj ruch PIERWSZYM najlepszym agentem
    let movedAgentId = moveSingleAgentExpert(null);

    // Wykonaj ruch DRUGIM najlepszym agentem (wykluczając tego, który przed chwilą się ruszył)
    moveSingleAgentExpert(movedAgentId);

    drawGrid();
  }

  // Funkcja zwraca ID agenta, który wykonał ruch, lub null
  function moveSingleAgentExpert(excludeAgentId) {
    let allPossibleMoves = [];

    agents.forEach(agent => {
      // Jeśli ten agent już się ruszał w tej turze, pomiń go
      if (excludeAgentId && agent.id === excludeAgentId) return;

      let options = [
        {x: agent.x - 1, y: agent.y + 1},
        {x: agent.x + 1, y: agent.y + 1}
      ];

      let validOptions = options.filter(o => o.x >= 0 && o.x < size && o.y >= 0 && o.y < size);

      validOptions.forEach(opt => {
        const spaceOccupiedByAgent = agents.some(a => a.x === opt.x && a.y === opt.y);
        const spaceOccupiedByPlayer = (player.x === opt.x && player.y === opt.y);

        if (!spaceOccupiedByAgent && !spaceOccupiedByPlayer) {
          let score = 0;

          // Składowe heurystyki z poprzedniej wersji
          score += opt.y * 25;

          if (opt.y === player.y - 1 && Math.abs(opt.x - player.x) === 1) {
            score += 150;
          }

          let distX = Math.abs(player.x - opt.x);
          score -= distX * 20;

          let tempAgentsY = agents.map(a => a.id === agent.id ? opt.y : a.y);
          let maxSpread = Math.max(...tempAgentsY) - Math.min(...tempAgentsY);
          score -= maxSpread * 60;

          if (player.x === 0 && opt.x === 1) score += 90;
          if (player.x === size - 1 && opt.x === size - 2) score += 90;

          allPossibleMoves.push({
            agentRef: agent,
            newX: opt.x,
            newY: opt.y,
            score: score
          });
        }
      });
    });

    if (allPossibleMoves.length > 0) {
      allPossibleMoves.sort((a, b) => b.score - a.score);
      let bestMove = allPossibleMoves[0];

      bestMove.agentRef.x = bestMove.newX;
      bestMove.agentRef.y = bestMove.newY;

      return bestMove.agentRef.id; // Zwróć ID, żeby zablokować go w kolejnym kroku tej samej tury
    }

    return null;
  }

  function endGame(success, msg) {
    isGameOver = true;
    endOverlay.classList.add("active");
    if (success) {
      endTitle.textContent = "MISJA UDANA!";
      endTitle.style.color = "#238636";
      (window.opener || window.parent).postMessage({ type: "minigameComplete" }, "*");
    } else {
      endTitle.textContent = "PORAŻKA!";
      endTitle.style.color = "#da3637";
    }
    endDesc.textContent = msg;
  }

  function resetGame() {
    player = { x: 4, y: size - 1 };
    agents = [
      { id: "A1", x: 1, y: 0 },
      { id: "A2", x: 3, y: 0 },
      { id: "A3", x: 5, y: 0 },
      { id: "A4", x: 7, y: 0 }
    ];
    isGameOver = false;
    endOverlay.classList.remove("active");
    drawGrid();
  }

  window.onload = resetGame;
</script>
</body>
</html>
